name: CI

# Standard-Gate: jeder Pull Request und jeder Push auf main.
on:
  pull_request:
  push:
    branches: [main]

# Kein Schreibzugriff auf das Repository nötig.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Ruff installieren
        run: python -m pip install "ruff==0.14.4"

      # Konfiguration (Regelauswahl + Excludes für Daten-/Generat-Verzeichnisse)
      # steht in pyproject.toml unter [tool.ruff].
      - name: ruff check
        run: ruff check .

  tests:
    name: tests (pytest, ohne slow/clap)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # libportaudio2: Import von sounddevice (src/services/live_player_service.py)
      # ffmpeg: pydub-Exporte in den Audio-Tests
      - name: System-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 ffmpeg

      # Torch/CUDA-Wheels brauchen Platz; nicht genutzte Runner-SDKs entfernen.
      - name: Platz für die Abhängigkeiten schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Enthält u. a. tests/test_isolation_sentinel.py (Sandbox-Beweis).
      # "slow"/"clap" bleiben außen vor -> siehe .github/workflows/integration-manual.yml
      - name: Tests
        run: python -m pytest tests -q -m "not slow and not clap"
